<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DeepSeek Harness Desktop — 首次运行引导</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: linear-gradient(160deg, #4d82ff 0%, #1e3ca0 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #fff; width: 560px; border-radius: 16px; padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    h1 { font-size: 24px; color: #1f2937; margin-bottom: 8px; }
    p.sub { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    .step { color: #4d82ff; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: #374151; margin: 14px 0 6px; }
    input[type=text], input[type=password], select {
      width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 14px; outline: none;
    }
    input:focus, select:focus { border-color: #4d82ff; }
    .row { display: flex; gap: 10px; align-items: center; }
    .btn {
      background: #4d82ff; color: #fff; border: 0; padding: 11px 22px; border-radius: 8px;
      font-size: 14px; cursor: pointer; font-weight: 600;
    }
    .btn:hover { background: #3b6fe0; }
    .btn.ghost { background: #eef2ff; color: #4d82ff; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 16px; line-height: 1.7; }
    .ok { color: #16a34a; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="step" id="stepLabel">步骤 1 / 4 — 欢迎</div>
    <div id="page1">
      <h1>欢迎使用 DeepSeek Harness Desktop</h1>
      <p class="sub">一键运行的 Agent 工作台。首次使用请完成以下三步配置，之后即可开始会话。</p>
      <div class="row" style="justify-content:flex-end;margin-top:28px">
        <button class="btn ghost" id="skipBtn">跳过引导</button>
        <button class="btn" id="next1">下一步</button>
      </div>
    </div>

    <div id="page2" style="display:none">
      <h1>选择工作区</h1>
      <p class="sub">Agent 将在工作区中读写文件、执行命令。</p>
      <label>工作区目录</label>
      <div class="row">
        <input type="text" id="workspaceInput" placeholder="点击右侧浏览选择目录" readonly />
        <button class="btn ghost" id="browseBtn">浏览</button>
      </div>
      <div class="row" style="justify-content:flex-end;margin-top:24px">
        <button class="btn ghost" id="back2">上一步</button>
        <button class="btn" id="next2">下一步</button>
      </div>
    </div>

    <div id="page3" style="display:none">
      <h1>配置 API Key</h1>
      <p class="sub">密钥只写不回显，安全存储在本地。</p>
      <label>DeepSeek API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-..." />
      <p class="hint">密钥仅保存在本机，不会上传。可稍后在「设置 → 模型」中修改。</p>
      <div class="row" style="justify-content:flex-end;margin-top:24px">
        <button class="btn ghost" id="back3">上一步</button>
        <button class="btn" id="next3">下一步</button>
      </div>
    </div>

    <div id="page4" style="display:none">
      <h1>选择运行模式</h1>
      <p class="sub">模式决定 Agent 的工具组合与工作方式。</p>
      <label>Agent preset</label>
      <select id="presetSelect">
        <option value="standard">标准模式 — 完整编码 Agent（推荐）</option>
        <option value="ptc">PTC 模式 — 用 TypeScript 程序组合多步操作</option>
        <option value="minimal">极简模式 — 仅 bash + 文件编辑</option>
      </select>
      <div class="row" style="justify-content:flex-end;margin-top:24px">
        <button class="btn ghost" id="back4">上一步</button>
        <button class="btn" id="finishBtn">完成并启动</button>
      </div>
      <div class="ok" id="okMsg" style="display:none">配置已保存，正在启动主界面…</div>
    </div>
  </div>
  <script src="./wizard.js"></script>
</body>
</html>
