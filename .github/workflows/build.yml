name: build-dsh-desktop

# 三平台打包矩阵：Windows/Linux 的 AppImage/deb 无法在 Windows 主机交叉构建，
# macOS dmg 必须在 macOS 上构建，故交由各平台原生 runner 构建。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            target: "--win --x64"
          - os: ubuntu-latest
            platform: linux
            target: "--linux --x64"
          - os: macos-14
            platform: mac
            target: "--mac --arm64" # 内置 node-runtime 为 arm64；x64 版待后续补充
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 dsh 运行时（runtime/node_modules）
        working-directory: runtime
        run: npm install --omit=dev --no-audit --no-fund

      - name: 按平台裁剪原生二进制（减小体积，加速解压/安装）
        run: bash scripts/prune-runtime.sh ${{ matrix.platform }}

      - name: 准备内置 Node 运行时（node-runtime/）
        run: bash scripts/prepare-runtime.sh ${{ matrix.platform }}

      - name: 安装 Electron 构建依赖
        working-directory: dsh-desktop
        run: npm install --no-audit --no-fund

      - name: 冒烟测试（node --test）
        working-directory: dsh-desktop
        run: node --test "test/*.test.js"

      - name: 替换 portable NSIS 模板（二次启动缓存加速）
        if: matrix.platform == 'win'
        run: bash scripts/patch-portable-nsi.sh

      - name: 构建产物（有签名证书时自动签名）
        working-directory: dsh-desktop
        shell: bash # Windows runner 默认 PowerShell，需显式 bash 解析 shell 语法
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # 无证书时跳过签名
          # secrets 未配置时展开为空字符串；shell 内非空才保留（否则 unset）
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder ${{ matrix.target }} --publish never

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.platform }}
          path: |
            dsh-desktop/dist/*.exe
            dsh-desktop/dist/*.AppImage
            dsh-desktop/dist/*.deb
            dsh-desktop/dist/*.dmg
            dsh-desktop/dist/*.zip
          if-no-files-found: warn
